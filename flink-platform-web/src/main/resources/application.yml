spring:
  application:
    name: flink-platform-web
  profiles:
    active: dev
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB
  config:
    import:
      - classpath:storage-${spring.profiles.active}.yml
      - classpath:apollo-${spring.profiles.active}.properties

management:
  metrics:
    tags:
      application: ${spring.application.name}
  info:
    env.enabled: true
    java.enabled: true
    os.enabled: true
  endpoint:
    env:
      show-values: never
    health:
      show-details: always
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: '*'

worker:
  flowExecThreads: 500
  perFlowExecThreads: 5
  maxPerFlowExecThreads: 10
  errorRetries: 3
  reactiveExecThreads: 10
  flinkSubmitTimeoutMills: 300000
  maxShellExecTimeoutMills: 28800000
  flowWaitTimeout: 12h
